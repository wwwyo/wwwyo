name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # README は置かない（AGENTS.md 設計原則）。home に本文が表示されるのを防ぐ。
      - name: Guard against README
        run: |
          if [ -n "$(find . -maxdepth 1 -iname 'readme*' -print -quit)" ]; then
            echo "::error::README を置かない（repo home はファイル一覧のままにする。入口文書は AGENTS.md）"
            exit 1
          fi
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      - run: bun install --frozen-lockfile
      # OGP カードの snapshot は外部サイトの取得を build から切り離している。
      # hobby に externalUrl を足して snapshot を作り忘れると、画像なしのカードが黙って出る
      - name: Check OGP snapshot
        run: bun tools/update-ogp.mjs --check
      - run: bun run build
