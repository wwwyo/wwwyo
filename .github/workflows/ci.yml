name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # README は置かない（AGENTS.md 設計原則）。home に本文が表示されるのを防ぐ。
      - name: Guard against README
        run: |
          if [ -n "$(find . -maxdepth 1 -iname 'readme*' -print -quit)" ]; then
            echo "::error::README を置かない（repo home はファイル一覧のままにする。入口文書は AGENTS.md）"
            exit 1
          fi
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
      - run: bun install --frozen-lockfile
      # .hallmark/preflight.json の sha256 が黙って drift すると、レビューで毎回指摘されて
      # その場で計算し直すことになる。設計ソースを変えたら preflight:update を回させる。
      - run: bun run preflight:check
      # 総称 monospace 単独の指定は日本語ロケールの Chromium + Osaka 不在の macOS で豆腐になる
      # （2026-10 に skillctrl のサムネと詳細ページで発生）。理由は tools/check-font-stack.mjs。
      - run: bun run check:font-stack
      - run: bun run build
